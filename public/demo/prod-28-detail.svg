<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="pGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f6f2e9" />
    </linearGradient>
    <pattern id="pGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#d99b26" stroke-width="0.75" opacity="0.15" />
    </pattern>
  </defs>
  
  <rect width="600" height="600" fill="url(#pGrad)" />
  <rect width="600" height="600" fill="url(#pGrid)" />
  
  <!-- Decorative frame -->
  <rect x="25" y="25" width="550" height="550" rx="20" fill="none" stroke="#d99b26" stroke-width="1.5" opacity="0.3" />
  
  <!-- Central Emblem Motif -->
  <g transform="translate(300, 260)">
    <circle r="150" fill="#0d484e" fill-opacity="0.08" />
    <circle r="120" fill="none" stroke="#0d484e" stroke-width="2" stroke-dasharray="10,6" opacity="0.4" />
    <polygon points="0,-90 64,-45 64,45 0,90 -64,45 -64,-45" fill="#0d484e" fill-opacity="0.15" stroke="#d99b26" stroke-width="2" />
    <circle r="36" fill="#c25438" fill-opacity="0.9" />
    <circle r="18" fill="#d99b26" />
  </g>
  
  <!-- Badges and Text -->
  <g transform="translate(300, 480)">
    <rect x="-180" y="-30" width="360" height="30" rx="15" fill="#0d484e" />
    <text text-anchor="middle" dominant-baseline="central" y="-15" font-family="sans-serif" font-weight="bold" font-size="12" fill="#ffffff" letter-spacing="1.2">CLOSE-UP VIEW</text>
    
    <text text-anchor="middle" y="24" font-family="sans-serif" font-weight="bold" font-size="18" fill="#20272b">Artisanal Craft #28 (Detail)</text>
    <text text-anchor="middle" y="52" font-family="sans-serif" font-weight="900" font-size="16" fill="#c25438">PKR 9,000</text>
  </g>
</svg>